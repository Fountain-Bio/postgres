name: build

# Publishes ghcr.io/fountain-bio/postgres so Railway can consume it as a SOURCE IMAGE.
#
# The source type matters. A Railway service that builds from this repo loses its database
# recognition: no Data tab, and `railway connect` answers "No supported database found in
# service". A service pointed at a pre-built image keeps it. So this workflow publishes the
# image and each Railway service stays image-sourced, with Source Image set to
# ghcr.io/fountain-bio/postgres:17.
#
# The package has to be pullable by Railway. Make it public under the org's package settings,
# or add registry credentials on each service.
#
# Runners and Docker actions are Blacksmith, matching the monorepo's
# donor-os-backend-docker.yml. Actions are pinned to commit SHAs with the tag in a trailing
# comment, which is that repo's convention and what Dependabot updates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A queued build for an older commit has nothing useful to publish once a newer one lands.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-17:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Blacksmith's builder keeps layers on a sticky disk, which is the one correct use of
      # sticky disks and much faster than `cache-from/to: type=gha` (that path is not rerouted
      # to Blacksmith's colocated cache). Cache key is per unique Dockerfile.
      #
      # Do NOT add `max-cache-size-mb` or a size-capped `docker buildx prune` here. Both are
      # v1-only and evict single-use records ahead of least-recently-used ones, so they delete
      # the layers the build just produced. The monorepo hit exactly that and documented it in
      # donor-os-backend-docker.yml. v2 needs no cache configuration: BuildKit's native GC ages
      # layers out after 8 days and keeps the ones still in use.
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
        with:
          cache-key: Dockerfile-17

      # Pull requests build without publishing, so a broken Dockerfile fails review rather
      # than overwriting the tag Railway pulls from.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/fountain-bio/postgres
          # `17` is the moving tag Railway points at. The sha tag gives every build a stable
          # identity, so a bad rollout can be pinned back to a known-good digest.
          tags: |
            type=raw,value=17
            type=raw,value=17-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: ./Dockerfile-17
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
