version: 2

updates:
  # Dependabot's docker file fetcher matches any filename containing "dockerfile" or
  # "containerfile", case-insensitively (DOCKER_REGEXP in dependabot-core), so Dockerfile-17
  # and Dockerfile-18 are picked up without renaming them.
  #
  # Each PR here is a PostgreSQL minor release. Read the Dockerfile header before merging:
  # a bump below the minor version a live data directory runs is a downgrade PostgreSQL does
  # not support, and merging publishes a new image rather than deploying it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
    labels:
      - dependencies
    # Each Dockerfile-<major> stays on its own PostgreSQL major. A major bump would point the
    # `<major>` tag at a server that cannot read the data directories already using it, so
    # only minor bumps are raised. Adding a new major means adding a new Dockerfile-<major>.
    ignore:
      - dependency-name: railwayapp-templates/postgres-ssl
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
